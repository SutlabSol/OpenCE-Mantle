name: Build & Publish OpenCE Mantle Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Core dependencies & build
        working-directory: core
        run: |
          yarn install
          yarn build

      - name: Install Desktop dependencies & package Windows binaries
        working-directory: desktop
        run: |
          yarn install
          node build-dist.js

      - name: Upload Installer & Portable .exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            desktop/release/OpenCE Mantle *.exe
            desktop/release/OpenCE Mantle Setup *.exe.blockmap
